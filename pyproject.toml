[project]
name = "llm-prompt-hub"
version = "0.1.0"
description = "prompt-hub: catálogo HTTP de los prompts de la flota — parser-io para la estructura, LLM validado solo para la ficha (semana 17)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
prompt-hub = "prompt_hub.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_hub"]

[dependency-groups]
dev = ["pytest>=8,<9"]
